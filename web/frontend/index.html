<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSC SRPK v2.0 - Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1220;
            --bg-secondary: #151935;
            --bg-tertiary: #1f2447;
            --text-primary: #e7e9ee;
            --text-secondary: #a3abc2;
            --accent: #7c5cff;
            --accent-hover: #6b4ce6;
            --success: #00d4aa;
            --warning: #ffb020;
            --error: #ff4757;
            --border: #1f2447;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }

        .nav {
            display: flex;
            gap: 20px;
        }

        .nav-item {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
        }

        .nav-item:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .nav-item.active {
            background: var(--accent);
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-error {
            background: var(--error);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-running {
            background: rgba(0, 212, 170, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-warning {
            background: rgba(255, 176, 32, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .status-error {
            background: rgba(255, 71, 87, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .metric-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .log-container {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
        }

        .log-info {
            color: var(--text-primary);
        }

        .log-success {
            color: var(--success);
        }

        .log-warning {
            color: var(--warning);
        }

        .log-error {
            color: var(--error);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        .notification-success {
            background: var(--success);
        }

        .notification-error {
            background: var(--error);
        }

        .notification-warning {
            background: var(--warning);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .code-snippet {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .similarity-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .similarity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--error) 0%, var(--warning) 50%, var(--success) 100%);
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header {
                flex-direction: column;
                gap: 20px;
            }
            
            .nav {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Componente principal de la aplicación
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [licenseKey, setLicenseKey] = useState('');
            const [licenseInfo, setLicenseInfo] = useState(null);
            const [analysisResults, setAnalysisResults] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [logs, setLogs] = useState([]);
            const [websocket, setWebsocket] = useState(null);
            const [systemStatus, setSystemStatus] = useState({});

            // Configurar WebSocket
            useEffect(() => {
                const ws = new WebSocket('ws://localhost:8000/ws');
                
                ws.onopen = () => {
                    console.log('WebSocket conectado');
                    setWebsocket(ws);
                };
                
                ws.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    handleWebSocketMessage(message);
                };
                
                ws.onclose = () => {
                    console.log('WebSocket desconectado');
                    setWebsocket(null);
                };
                
                return () => {
                    ws.close();
                };
            }, []);

            const handleWebSocketMessage = (message) => {
                switch (message.type) {
                    case 'analysis_started':
                        setIsAnalyzing(true);
                        addLog('Iniciando análisis...', 'info');
                        break;
                    case 'analysis_progress':
                        addLog(`Procesados ${message.data.files_processed} archivos`, 'info');
                        break;
                    case 'analysis_completed':
                        setIsAnalyzing(false);
                        setAnalysisResults(message.data);
                        addLog('Análisis completado', 'success');
                        break;
                    case 'analysis_error':
                        setIsAnalyzing(false);
                        addLog(`Error: ${message.data.error}`, 'error');
                        break;
                    default:
                        break;
                }
            };

            const addLog = (message, type = 'info') => {
                const timestamp = new Date().toLocaleTimeString();
                setLogs(prev => [...prev, { timestamp, message, type }]);
            };

            const validateLicense = async () => {
                try {
                    const response = await axios.post('/api/license/validate', {
                        license_key: licenseKey
                    });
                    
                    if (response.data.valid) {
                        setLicenseInfo(response.data.license_info);
                        showNotification('Licencia válida', 'success');
                    } else {
                        showNotification('Licencia inválida', 'error');
                    }
                } catch (error) {
                    showNotification('Error validando licencia', 'error');
                }
            };

            const startAnalysis = async (projectPath) => {
                try {
                    setIsAnalyzing(true);
                    const response = await axios.post('/api/analysis/start', {
                        project_path: projectPath,
                        license_key: licenseKey
                    });
                    
                    if (response.data.status === 'started') {
                        addLog('Análisis iniciado', 'info');
                    }
                } catch (error) {
                    setIsAnalyzing(false);
                    showNotification('Error iniciando análisis', 'error');
                }
            };

            const runTests = async (framework = 'pytest') => {
                try {
                    const response = await axios.post('/api/tests/run', {
                        framework,
                        license_key: licenseKey
                    });
                    
                    if (response.data.status === 'completed') {
                        showNotification('Tests completados', 'success');
                        addLog(`Tests ejecutados: ${response.data.results.total_tests}`, 'success');
                    }
                } catch (error) {
                    showNotification('Error ejecutando tests', 'error');
                }
            };

            const generateReport = async () => {
                try {
                    const response = await axios.post('/api/reports/generate', {
                        output_path: 'quality_report.json',
                        license_key: licenseKey
                    });
                    
                    if (response.data.status === 'completed') {
                        showNotification('Reporte generado', 'success');
                        addLog('Reporte generado exitosamente', 'success');
                    }
                } catch (error) {
                    showNotification('Error generando reporte', 'error');
                }
            };

            const findSimilarCode = async (codeSnippet) => {
                try {
                    const response = await axios.post('/api/code/find', {
                        code_snippet: codeSnippet,
                        threshold: 0.7,
                        license_key: licenseKey
                    });
                    
                    if (response.data.status === 'completed') {
                        showNotification(`Encontrados ${response.data.results.length} fragmentos similares`, 'success');
                        return response.data.results;
                    }
                } catch (error) {
                    showNotification('Error buscando código', 'error');
                }
                return [];
            };

            const showNotification = (message, type) => {
                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 3000);
            };

            const renderDashboard = () => (
                <div className="fade-in">
                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">
                                <i className="fas fa-tachometer-alt"></i> Dashboard
                            </h2>
                            <div className="status-indicator status-running">
                                <i className="fas fa-circle"></i>
                                Sistema Activo
                            </div>
                        </div>
                        
                        {analysisResults && (
                            <div className="metrics-grid">
                                <div className="metric-card">
                                    <div className="metric-value">{analysisResults.metrics?.total_nodes || 0}</div>
                                    <div className="metric-label">Nodos Analizados</div>
                                </div>
                                <div className="metric-card">
                                    <div className="metric-value">{analysisResults.metrics?.total_loc || 0}</div>
                                    <div className="metric-label">Líneas de Código</div>
                                </div>
                                <div className="metric-card">
                                    <div className="metric-value">
                                        {(analysisResults.metrics?.average_complexity || 0).toFixed(1)}
                                    </div>
                                    <div className="metric-label">Complejidad Promedio</div>
                                </div>
                                <div className="metric-card">
                                    <div className="metric-value">
                                        {(analysisResults.metrics?.average_maintainability || 0).toFixed(1)}
                                    </div>
                                    <div className="metric-label">Mantenibilidad</div>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h3 className="card-title">Logs del Sistema</h3>
                        </div>
                        <div className="log-container">
                            {logs.map((log, index) => (
                                <div key={index} className={`log-entry log-${log.type}`}>
                                    <span className="text-secondary">[{log.timestamp}]</span> {log.message}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderLicense = () => (
                <div className="fade-in">
                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">
                                <i className="fas fa-key"></i> Gestión de Licencias
                            </h2>
                        </div>
                        
                        <div className="form-group">
                            <label className="form-label">Clave de Licencia</label>
                            <input
                                type="text"
                                className="form-input"
                                value={licenseKey}
                                onChange={(e) => setLicenseKey(e.target.value)}
                                placeholder="Ingresa tu clave de licencia MSC SRPK"
                            />
                        </div>
                        
                        <button className="btn btn-primary" onClick={validateLicense}>
                            <i className="fas fa-check"></i> Validar Licencia
                        </button>
                        
                        {licenseInfo && (
                            <div style={{ marginTop: '20px', padding: '20px', background: 'var(--bg-tertiary)', borderRadius: '8px' }}>
                                <h4>Información de Licencia</h4>
                                <p><strong>Tipo:</strong> {licenseInfo.license_type}</p>
                                <p><strong>Cliente:</strong> {licenseInfo.customer_name}</p>
                                <p><strong>Email:</strong> {licenseInfo.email}</p>
                                <p><strong>Expira:</strong> {licenseInfo.expires_at}</p>
                                <p><strong>Características:</strong> {licenseInfo.features.join(', ')}</p>
                            </div>
                        )}
                    </div>
                </div>
            );

            const renderAnalysis = () => (
                <div className="fade-in">
                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">
                                <i className="fas fa-search"></i> Análisis de Proyecto
                            </h2>
                        </div>
                        
                        <div className="form-group">
                            <label className="form-label">Ruta del Proyecto</label>
                            <input
                                type="text"
                                className="form-input"
                                placeholder="/ruta/a/tu/proyecto"
                            />
                        </div>
                        
                        <button 
                            className="btn btn-primary" 
                            onClick={() => startAnalysis('/ruta/ejemplo')}
                            disabled={isAnalyzing}
                        >
                            {isAnalyzing ? (
                                <>
                                    <div className="loading"></div>
                                    Analizando...
                                </>
                            ) : (
                                <>
                                    <i className="fas fa-play"></i>
                                    Iniciar Análisis
                                </>
                            )}
                        </button>
                        
                        <button className="btn btn-secondary" onClick={() => runTests()}>
                            <i className="fas fa-vial"></i> Ejecutar Tests
                        </button>
                        
                        <button className="btn btn-success" onClick={generateReport}>
                            <i className="fas fa-file-alt"></i> Generar Reporte
                        </button>
                    </div>
                </div>
            );

            const renderCodeSearch = () => (
                <div className="fade-in">
                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">
                                <i className="fas fa-search"></i> Búsqueda de Código Similar
                            </h2>
                        </div>
                        
                        <div className="form-group">
                            <label className="form-label">Fragmento de Código</label>
                            <textarea
                                className="form-input form-textarea"
                                placeholder="def mi_funcion(x):&#10;    return x * 2"
                            />
                        </div>
                        
                        <button className="btn btn-primary" onClick={() => findSimilarCode('ejemplo')}>
                            <i className="fas fa-search"></i> Buscar Código Similar
                        </button>
                    </div>
                </div>
            );

            const renderContent = () => {
                switch (activeTab) {
                    case 'dashboard':
                        return renderDashboard();
                    case 'license':
                        return renderLicense();
                    case 'analysis':
                        return renderAnalysis();
                    case 'search':
                        return renderCodeSearch();
                    default:
                        return renderDashboard();
                }
            };

            return (
                <div className="container">
                    <header className="header">
                        <div className="logo">MSC SRPK v2.0</div>
                        <nav className="nav">
                            <a 
                                className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`}
                                onClick={() => setActiveTab('dashboard')}
                            >
                                <i className="fas fa-tachometer-alt"></i> Dashboard
                            </a>
                            <a 
                                className={`nav-item ${activeTab === 'license' ? 'active' : ''}`}
                                onClick={() => setActiveTab('license')}
                            >
                                <i className="fas fa-key"></i> Licencia
                            </a>
                            <a 
                                className={`nav-item ${activeTab === 'analysis' ? 'active' : ''}`}
                                onClick={() => setActiveTab('analysis')}
                            >
                                <i className="fas fa-search"></i> Análisis
                            </a>
                            <a 
                                className={`nav-item ${activeTab === 'search' ? 'active' : ''}`}
                                onClick={() => setActiveTab('search')}
                            >
                                <i className="fas fa-code"></i> Búsqueda
                            </a>
                        </nav>
                    </header>
                    
                    <main>
                        {renderContent()}
                    </main>
                </div>
            );
        }

        // Renderizar la aplicación
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
