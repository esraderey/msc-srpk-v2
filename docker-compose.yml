# MSC SRPK v2.0 - Docker Compose para despliegue económico
# Ideal para VPS pequeño ($5-10/mes): DigitalOcean, Hetzner, Contabo
#
# Uso:
#   cp .env.example .env   # Configurar variables
#   docker compose up -d   # Iniciar todo
#   docker compose logs -f # Ver logs

version: "3.8"

services:
  # --- Aplicación web (FastAPI + Landing + Dashboards) ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: msc-srpk-web
    restart: unless-stopped
    env_file: .env
    environment:
      - MSC_SRPK_ENV=production
      - MSC_SRPK_WEB_HOST=0.0.0.0
      - MSC_SRPK_WEB_PORT=8000
    volumes:
      - app_data:/app/data
      - app_cache:/app/cache
    networks:
      - msc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # No exponer puerto directamente - nginx hace proxy
    expose:
      - "8000"

  # --- Nginx reverse proxy + SSL ---
  nginx:
    image: nginx:alpine
    container_name: msc-srpk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - msc-network

  # --- Certbot para SSL gratuito con Let's Encrypt ---
  certbot:
    image: certbot/certbot
    container_name: msc-srpk-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renovar certificados cada 12 horas
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # --- Redis para cache (opcional, mejora rendimiento) ---
  redis:
    image: redis:7-alpine
    container_name: msc-srpk-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - msc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  app_data:
  app_cache:
  redis_data:
  certbot_certs:
  certbot_www:

networks:
  msc-network:
    driver: bridge
