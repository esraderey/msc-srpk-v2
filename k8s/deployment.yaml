apiVersion: apps/v1
kind: Deployment
metadata:
  name: msc-srpk-web
  labels:
    app: msc-srpk
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: msc-srpk
      component: web
  template:
    metadata:
      labels:
        app: msc-srpk
        component: web
    spec:
      containers:
      - name: msc-srpk-web
        image: msc-srpk:latest
        ports:
        - containerPort: 8000
        env:
        - name: MSC_SRPK_ENV
          value: "production"
        - name: MSC_SRPK_LOG_LEVEL
          value: "INFO"
        - name: MSC_SRPK_CACHE_SIZE
          value: "1000"
        - name: MSC_SRPK_MAX_WORKERS
          value: "4"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/status
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: cache-volume
          mountPath: /app/cache
        - name: config-volume
          mountPath: /app/config
      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 2Gi
      - name: config-volume
        configMap:
          name: msc-srpk-config
      imagePullSecrets:
      - name: regcred

---
apiVersion: v1
kind: Service
metadata:
  name: msc-srpk-service
  labels:
    app: msc-srpk
spec:
  selector:
    app: msc-srpk
    component: web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: msc-srpk-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: msc-srpk-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: msc-srpk-config
data:
  config.yaml: |
    performance:
      cache_size: 1000
      max_workers: 4
      batch_size: 32
      memory_threshold: 0.8
    
    security:
      jwt_secret: "your-jwt-secret"
      encryption_key: "your-encryption-key"
    
    database:
      path: "/app/data/msc_srpk.db"
      backup_interval: 3600
    
    logging:
      level: "INFO"
      format: "json"
      output: "stdout"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: msc-srpk-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msc-srpk-worker
  labels:
    app: msc-srpk
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: msc-srpk
      component: worker
  template:
    metadata:
      labels:
        app: msc-srpk
        component: worker
    spec:
      containers:
      - name: msc-srpk-worker
        image: msc-srpk:latest
        command: ["python", "-m", "msc_srpk.worker"]
        env:
        - name: MSC_SRPK_ENV
          value: "production"
        - name: MSC_SRPK_LOG_LEVEL
          value: "INFO"
        - name: MSC_SRPK_WORKER_MODE
          value: "true"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: config-volume
          mountPath: /app/config
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: msc-srpk-data
      - name: config-volume
        configMap:
          name: msc-srpk-config

---
apiVersion: v1
kind: Service
metadata:
  name: msc-srpk-worker-service
  labels:
    app: msc-srpk
    component: worker
spec:
  selector:
    app: msc-srpk
    component: worker
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
